<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Duc Nguyen</title>
    <meta name="description" content="Legacy redirect and not-found page for Duc Nguyen's site.">
    <style>
        :root {
            color-scheme: light dark;
            font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #fbfbfa;
            color: #1a1a1a;
        }

        main {
            width: min(100%, 540px);
            padding: 32px 28px;
            border: 1px solid rgba(26, 26, 26, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.8);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 6vw, 42px);
            line-height: 1.05;
        }

        p {
            margin: 0 0 16px;
            line-height: 1.7;
            color: #4a4a46;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
        }

        a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
        }

        code {
            font-family: ui-monospace, "SF Mono", "Fira Code", monospace;
            font-size: 0.95em;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #17130f;
                color: #efe6d2;
            }

            main {
                background: rgba(33, 27, 22, 0.92);
                border-color: rgba(239, 230, 210, 0.12);
            }

            p {
                color: #cec0a7;
            }
        }
    </style>
    <script>
        (function () {
            var pathname = window.location.pathname.replace(/\/+$/, '') || '/';
            var segments = pathname.split('/').filter(Boolean);
            var legacyKey = segments.length ? segments[segments.length - 1] : '';
            var map = {
                works: 'work/',
                work: 'work/',
                learning: 'study/',
                favorites: 'offline/',
                music: 'offline/',
                arts: ''
            };

            if (Object.prototype.hasOwnProperty.call(map, legacyKey)) {
                var baseSegments = segments.slice(0, -1);
                var basePath = '/' + baseSegments.join('/');

                if (basePath !== '/' && !basePath.endsWith('/')) {
                    basePath += '/';
                }

                window.location.replace(basePath + map[legacyKey]);
                return;
            }

            var homePath = segments.length > 1 && segments[0].indexOf('.') !== -1 ? '/' + segments[0] + '/' : '/';
            document.addEventListener('DOMContentLoaded', function () {
                var homeLink = document.getElementById('home-link');
                var workLink = document.getElementById('work-link');
                var studyLink = document.getElementById('study-link');
                var blogLink = document.getElementById('blog-link');

                if (homeLink) homeLink.href = homePath;
                if (workLink) workLink.href = homePath + 'work/';
                if (studyLink) studyLink.href = homePath + 'study/';
                if (blogLink) blogLink.href = homePath + 'blog/';
            });
        })();
    </script>
</head>
<body>
    <main>
        <h1>Page not found</h1>
        <p>The route <code id="missing-path"></code> does not exist on this site. Older shortcuts still redirect, but unknown paths now stay on a real 404 page.</p>
        <nav aria-label="Suggested destinations">
            <a id="home-link" href="./">Home</a>
            <a id="work-link" href="work/">Work</a>
            <a id="study-link" href="study/">Study</a>
            <a id="blog-link" href="blog/">Blog</a>
        </nav>
    </main>
    <script>
        document.getElementById('missing-path').textContent = window.location.pathname;
    </script>
</body>
</html>
